[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "value-segments"
version = "0.1.0"
description = "Two-by-two customer segmentation on predicted CLV and churn proxy, Olist (LT05)"
requires-python = ">=3.12"
dependencies = [
    "pandas==3.1.1",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
    "lifetimes==0.11.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "jupytext==1.19.6",
    "nbconvert==7.17.2",
    "ipykernel==7.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
